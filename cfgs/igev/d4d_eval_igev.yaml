DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: D4DDataset
            DATA_SPLIT: {
                EVALUATING: ./data/D4D/d4d_test.txt
            }
            MAX_DISP: 256
            MIN_DEPTH: 0.01
            MAX_DEPTH: 0.5

    DATA_TRANSFORM:
        EVALUATING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: 256
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3
