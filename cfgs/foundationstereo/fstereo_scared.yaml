DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: ScaredDataset
            DATA_SPLIT: {
                TRAINING: ./data/SCARED/scared_train.txt,
                EVALUATING: ./data/SCARED/scared_val.txt,
                TESTING: ./data/SCARED/scared_test.txt
            }
            RETURN_RIGHT_DISP: false
            SCALE_FACTOR: 128.0

    DATA_TRANSFORM:
        TRAINING:
            - { NAME: StereoColorJitter, BRIGHTNESS: [ 0.7, 1.3 ], CONTRAST: [ 0.7, 1.3 ], SATURATION: [ 0.7, 1.3 ], HUE: 0.3, ASYMMETRIC_PROB: 0 }
            - { NAME: RandomErase, PROB: 0.5, MAX_TIME: 2, BOUNDS: [ 50, 100 ] }
            - { NAME: RandomCrop, SIZE: [ 320, 736 ], Y_JITTER: false }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }
        EVALUATING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
            - { NAME: NormalizeImage, MEAN: [ 0.485, 0.456, 0.406 ], STD: [ 0.229, 0.224, 0.225 ] }

MODEL:
    NAME: FoundationStereo
    corr_levels: 2
    corr_radius: 4
    hidden_dims: [ 128, 128, 128 ]
    low_memory: 1
    max_disp: &max_disp 256
    mixed_precision: true
    n_downsample: 2
    n_gru_layers: 3
    vit_size: 'vitl'
    train_iters: 22
    valid_iters: 32
    FIND_UNUSED_PARAMETERS: true
    CKPT: -1
    PRETRAINED_MODEL: '/home/meiying/Meiying_Masterarbeit/OpenStereo/pretrained/Foundation_Sceneflow.pt'

OPTIMIZATION:
    FREEZE_BN: true
    SYNC_BN: true
    AMP: true
    BATCH_SIZE_PER_GPU: 1
    NUM_EPOCHS: 50

    OPTIMIZER:
        NAME: AdamW
        LR: &lr 0.0001
        WEIGHT_DECAY: 0.00001
        EPS: 0.00000001

    SCHEDULER:
        NAME: OneCycleLR
        MAX_LR: *lr
        PCT_START: 0.01
        ON_EPOCH: False

    CLIP_GRAD:
        TYPE: value
        CLIP_VALUE: 0.1

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: *max_disp
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3

TRAINER:
    EVAL_INTERVAL: 1
    CKPT_SAVE_INTERVAL: 1
    MAX_CKPT_SAVE_NUM: 10
    LOGGER_ITER_INTERVAL: 10
    TRAIN_VISUALIZATION: True
    EVAL_VISUALIZATION: True
