DATA_CONFIG:
    DATA_INFOS:
        -   DATASET: ScaredDataset
            DATA_SPLIT: {
                EVALUATING: ./data/SCARED/scared_val.txt,
                TESTING: ./data/SCARED/scared_test.txt
            }
            RETURN_RIGHT_DISP: false
            SCALE_FACTOR: 128.0

    DATA_TRANSFORM:
        EVALUATING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }
        TESTING:
            - { NAME: DivisiblePad, BY: 32 }
            - { NAME: TransposeImage }
            - { NAME: ToTensor }

EVALUATOR:
    BATCH_SIZE_PER_GPU: 1
    MAX_DISP: 256
    METRIC:
        - d1_all
        - epe
        - thres_1
        - thres_2
        - thres_3
